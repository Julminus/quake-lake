name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: pytest (recorded fixtures, no network)
        run: uv run pytest --cov --cov-report=term-missing
      - name: CLI smoke test
        run: uv run quake-lake --help

  minio:
    runs-on: ubuntu-latest
    env:
      QUAKE_LAKE_MINIO: "1"
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: quakelake
      AWS_SECRET_ACCESS_KEY: quakelake-local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: start MinIO and create the bucket (compose.yaml)
        run: |
          docker compose up -d --wait minio
          docker compose run --rm createbucket
      - name: storage against a real MinIO
        run: uv run pytest -m minio -v

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the Airflow image (compose.yaml)
        run: docker compose build airflow-cli
      - name: DAG tests, in the Airflow image
        # QUAKE_LAKE_AIRFLOW=1: a broken Airflow import fails the tests instead of skipping them.
        run: >-
          docker compose run --rm --no-deps -e QUAKE_LAKE_AIRFLOW=1 -v "$PWD:/repo:ro" -w /repo
          --entrypoint bash airflow-cli
          -c "pip install --quiet --no-cache-dir pytest==9.2.0 && python -m pytest -p no:cacheprovider -v tests/test_dag.py"
      - name: httpfs is in the image (dbt mustn't need the network to read S3)
        run: >-
          docker run --rm --network none --entrypoint /app/.venv/bin/python quake-lake-airflow:dev
          -c "import duckdb; duckdb.sql('LOAD httpfs')"
      - name: the DAG's tasks on a recorded day, on MinIO (nothing fetched)
        run: |
          docker compose run --rm createbucket
          docker compose run --rm -v "$PWD/tests/fixtures:/fixtures:ro" --entrypoint mc createbucket cp --quiet \
            /fixtures/usgs-palu-2018-09-28.json \
            "local/lake/bronze/source=usgs/ingest_date=2026-11-20/20180928T000000Z_20180929T000000Z.json"
          # `airflow tasks test` exits 0 when the task fails, so each step reads the log.
          # (`airflow dags test` can't run a DAG with a deadline in 3.3.2: apache/airflow#73428.)
          # One container for all three: every `compose run` with deps re-runs airflow-init.
          mkdir -m 777 out
          docker compose run --rm -v "$PWD/out:/out" --entrypoint bash airflow-cli -c \
            'for t in silver gold freshness; do airflow tasks test quake_lake $t > /out/$t.txt 2>&1; done'
          grep "wrote 81 events in 1 monthly partition to s3://lake/silver/" out/silver.txt
          if grep "Task failed" out/silver.txt out/gold.txt; then exit 1; fi
          grep -E "Done\. PASS=[0-9]+ WARN=0 ERROR=0 SKIP=0" out/gold.txt
          # Gold holds the events dbt read from MinIO through DuckDB's httpfs.
          docker compose run --rm --no-deps --entrypoint /app/.venv/bin/python airflow-cli -c \
            "import duckdb; n = duckdb.connect('/app/lake/gold.duckdb', read_only=True).execute('select count(*) from fct_earthquakes').fetchone()[0]; print(n); assert n == 81"
          # The recorded day is from 2018: freshness must fail the task.
          grep "ERROR STALE freshness of silver.events" out/freshness.txt
          grep "Task failed" out/freshness.txt

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (providers from the lock file)
        run: terraform init -input=false -lockfile=readonly
      - name: terraform validate
        run: terraform validate
      - name: tflint (with the AWS ruleset)
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: terraform test (mocked AWS provider)
        run: terraform test
      - name: terraform plan, with no AWS account (never applied)
        run: terraform plan -input=false -lock=false -var plan_without_credentials=true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the CLI image
        run: docker build -t quake-lake:ci .
      - name: run the CLI image
        run: |
          docker run --rm quake-lake:ci --help
          # As its non-root user, the image must be able to write the default bronze root.
          docker run --rm --entrypoint python quake-lake:ci -c \
            "from quake_lake.storage import open_storage as o; s = o('lake/bronze'); s.put('a.json', b'{}'); print(s.list())"
          # Silver's dependencies and the bundled province table ship in the image.
          docker run --rm -v "$PWD/tests/fixtures/usgs-palu-2018-09-28.json:/bronze/source=usgs/ingest_date=2026-11-20/20180928T000000Z_20180929T000000Z.json:ro" \
            quake-lake:ci silver --bronze /bronze --silver /tmp/silver | tee silver.txt
          grep -q "wrote 81 events in 1 monthly partition to /tmp/silver" silver.txt
      - name: the handler runs in the AWS Lambda runtime with only the runtime's packages
        run: |
          # The source tree mounted at /var/task is what a zip deployment ships.
          # A bad event needs no network: the runtime must load the handler and return its error.
          docker run -d --rm --name lambda -p 9000:8080 -v "$PWD/src:/var/task:ro" \
            -e BRONZE_URI=/tmp/bronze \
            public.ecr.aws/lambda/python:3.12@sha256:f229f304f82f5016fe26e4714d05b6a8196e0c6c61b463112841a5e3c3647163 \
            quake_lake.handler.lambda_handler
          for i in $(seq 30); do
            curl -s -d '{"sources": []}' http://127.0.0.1:9000/2015-03-31/functions/function/invocations > lambda.json && break
            sleep 1
          done
          cat lambda.json
          grep -q '"errorType": "ValueError"' lambda.json
          grep -q "'sources' must list some of" lambda.json
          docker stop lambda
