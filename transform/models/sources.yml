sources:
  - name: silver
    description: The silver layer written by `quake-lake silver`, read in place as Parquet.
    tables:
      - name: events
        description: >
          One row per event: USGS's, or BMKG's for an event USGS doesn't list. Typed,
          validated and deduplicated in silver (see the README's column table).
        config:
          meta:
            external_location: "read_parquet('{{ env_var('SILVER_URI', 'lake/silver') }}/events/*/*/*.parquet', hive_partitioning = false)"
          # The newest origin time. M4+ events happen in this box every day, so two days
          # without one means ingestion has stopped, not that the earth went quiet.
          loaded_at_field: '"time"'
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: event_id
            data_tests: [unique, not_null]

  - name: reference
    description: Reference data bundled with the package.
    tables:
      - name: provinces
        description: >
          522 regency, city and lake reference points with their province, the table
          silver's province step uses (built by scripts/build_provinces.py).
        config:
          meta:
            external_location: "read_csv('src/quake_lake/provinces.csv', header = true)"
        columns:
          - name: province_code
            data_tests: [not_null]
